
{% extends "layouts/base.html" %}
{% load static %}
{% block extra_head %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block title %}Iniciar Sesión{% endblock %}


{% block content %}
<section class="h-100 gradient-form" style="background-color: #eee;">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-xl-10">
        <div class="card rounded-3 text-black">
          <div class="row g-0">
            <div class="col-lg-6">
              <div class="card-body p-md-5 mx-md-4">

                <div class="text-center">
                  <img src="{% static 'images/logo.jpeg' %}"
                    style="width: 185px;" alt="logo">
                 {# <h4 class="mt-1 mb-5 pb-1">{eskul name}</h4> #}
                </div>

                <form>
                  <br>
                  <div data-mdb-input-init class="form-outline mb-4">
                  <label class="form-label" for="form2Example11">Email</label>
                    <input type="email" id="form2Example11" class="form-control" placeholder="ejemplo@institucion.edu.do" />
                  </div>
                  <div data-mdb-input-init class="form-outline mb-4">
                    <label class="form-label" for="form2Example22">Contraseña</label>
                    <input type="password" id="form2Example22" class="form-control" placeholder="**********"/>
                  </div>
                  <div class="text-center pt-1 mb-5 pb-1">
                    <button type="submit" class="btn btn-primary btn-block mb-3" style="font-size: 16px;">Iniciar sesión</button>
                    <br>
                    <a class="text-muted" href="#!">¿Olvidaste tu contraseña?</a>
                  </div>
                </form>
              </div>
            </div>
            <div class="col-lg-6 d-flex align-items-center gradient-custom-2">
              <img src="{% static 'images/escuelaGenerica.jpeg' %}" class="" alt="Escuela" style="width:100%; height:100%; object-fit:cover; border-radius: 0 4px 4px 0;" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
